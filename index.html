<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Movie Catalog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <input id="searchInput" placeholder="Search movie">
  <button id="searchBtn">Find</button>
  <a href="favorites.html">Favorites (<span id="favCount">0</span>)</a>
</header>

<aside class="filters">
  <label><input type="checkbox" value="Drama"> Drama</label>
  <label><input type="checkbox" value="Comedy"> Comedy</label>
  <label><input type="checkbox" value="Action"> Action</label>
  <label><input type="checkbox" value="Sci-Fi"> Sci-Fi</label>
</aside>

<main>
  <p id="counter"></p>
  <div id="movies" class="grid"></div>
  <button id="loadMore">Show more</button>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
